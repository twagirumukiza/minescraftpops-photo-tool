<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinescraftPops – Éditeur</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a0f;--card:#1a2a1a;--text:#e8f5e9;--muted:#a0b8a0;--acc:#5cdb5c;--acc2:#ffd54f;--bd:#2a4a2a;--hd:#0a150a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:var(--hd);padding:1rem 1.5rem;border-bottom:3px solid var(--bd)}
header h1{font-family:'Press Start 2P',monospace;font-size:.9rem;line-height:1.5}
header p{color:var(--muted);font-size:.9rem;margin-top:.3rem}
main{max-width:1000px;margin:0 auto;padding:1.5rem 1rem 6rem}
.card{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:1rem;margin-bottom:1rem}
.card.drag{border-color:var(--acc2)}
.drop{text-align:center;padding:2rem 1rem;border-style:dashed}
.drop p{color:var(--muted);margin:.4rem 0 1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.num{background:var(--acc2);color:#1a1a1a;font-weight:800;padding:.15rem .55rem;border-radius:6px;margin-right:.5rem}
.muted{color:var(--muted);font-size:.85rem}
.price{color:var(--acc2);font-weight:800}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.7rem;margin:.9rem 0}
label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted);font-weight:700;gap:.2rem}
input[type=text],input[type=number],textarea{background:var(--bg);color:var(--text);border:2px solid var(--bd);border-radius:8px;padding:.5rem;font:inherit;font-size:.9rem}
textarea{resize:vertical;min-height:3rem}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.slot{border:2px dashed var(--bd);border-radius:10px;aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center;text-align:center;font-size:.8rem;color:var(--muted);background:var(--bg);padding:.3rem}
.slot:hover{border-color:var(--acc)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot b{position:absolute;bottom:0;left:0;right:0;background:rgba(10,21,10,.88);color:var(--text);padding:.2rem;font-size:.68rem;word-break:break-all}
.slot input{display:none}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:10px;border:none;padding:.55rem 1rem}
.btn{background:var(--acc);color:#0a150a;box-shadow:0 4px 0 #3d9140}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn2{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn-x{background:transparent;color:#ff7b6b;border:2px solid #ff7b6b}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--hd);border-top:3px solid var(--bd);padding:.7rem 1rem;display:flex;justify-content:center;gap:.8rem;align-items:center;flex-wrap:wrap}
dialog{background:var(--card);color:var(--text);border:2px solid var(--acc);border-radius:14px;padding:1.2rem;max-width:520px;width:92%;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{font-family:'Press Start 2P',monospace;font-size:.7rem;color:var(--acc);margin-bottom:.9rem}
.opt{flex-direction:row;align-items:center;gap:.5rem;font-size:.9rem;color:var(--text);font-weight:700;padding:.2rem 0}
.plist{max-height:220px;overflow:auto;border:2px solid var(--bd);border-radius:8px;padding:.4rem .6rem;margin:.5rem 0}
.plist .opt{font-weight:400;font-size:.82rem}
#status{color:var(--acc2);font-weight:700}
@media(max-width:560px){.slots{grid-template-columns:repeat(2,1fr)}}
select{font:inherit;padding:.5rem;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:inherit}
.mv{padding:.25rem .6rem!important}
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.exi{border:2px solid var(--bd);border-radius:10px;padding:.4rem;background:var(--bg);display:grid;gap:.3rem;align-content:start;font-size:.7rem;word-break:break-all}
.exi img,.exi video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#000}
.exb{display:flex;gap:.25rem;flex-wrap:wrap}
.rtb{display:flex;gap:.3rem;flex-wrap:wrap;margin:.2rem 0}
.rtb button{background:var(--bg);color:var(--text);border:2px solid var(--bd);border-radius:6px;padding:.2rem .5rem;font-size:.8rem;cursor:pointer}
.rtb button:hover{border-color:var(--acc)}
.rte{min-height:7rem;background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:.6rem;font-size:.9rem;color:var(--text);overflow:auto;max-height:260px}
.rte:focus{outline:none;border-color:var(--acc)}
.rte ul,.rte ol{margin-left:1.3rem}
.sb{position:absolute;top:.3rem;left:.3rem;right:.3rem;display:flex;gap:.3rem;flex-wrap:wrap;z-index:2}
.sb button{font-size:.7rem;padding:.15rem .4rem;border-radius:6px;border:2px solid #000;background:rgba(10,21,10,.85);color:#fff;cursor:pointer}
.slot .cur{opacity:.55}
.undo-row{display:flex;gap:.4rem;flex-wrap:wrap}
.sb .cov{background:#ffd54f!important;color:#1a1a1a!important;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>⛏️ MinescraftPops – Éditeur</h1>
  <p>Charge l'index du site, modifie ou ajoute des items, puis télécharge le nouvel index et les photos.</p>
</header>
<main id="app"></main>
<div class="bar" id="bar" hidden>
  <span id="status"></span>
  <button class="btn" onclick="openDl()">⬇️ Télécharger…</button>
</div>
<dialog id="dlg"></dialog>

<script>
const ANG=[['front','Face'],['right','Côté droit'],['left','Côté gauche'],['back','Dos']];
const HINT={front:/face|front|avant/i,right:/droit|right/i,left:/gauche|left/i,back:/dos|back|arri/i};
const SITE='https://twagirumukiza.github.io/MinescraftPops/index.html';
const SITE_BASE=SITE.replace(/index\.html$/,'');
const TYPES={premium:'⭐ Premium',accessory:'🔗 Accessoire'};
const COND={new:'Neuf',vgood:'Très bon état',good:'Bon état'};
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slugify=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
let src='',start=-1,end=-1,products=[],defPrice=9.99,photos={},view='load',cur=null;

/* ---------- Historique (annuler / rétablir) ---------- */
let undoSt=[],redoSt=[],editBackup=null;
function snap(){return {products:products.map(p=>{const c=JSON.parse(JSON.stringify(p,(k,v)=>k==='mlist'?undefined:v));c.mlist=(p.mlist||[]).map(e=>({...e}));return c;}),photos:Object.fromEntries(Object.entries(photos).map(([k,v])=>[k,{...v}]))};}
function sig(x){return JSON.stringify(x.products.map(p=>({...p,mlist:(p.mlist||[]).map(e=>e.old||(e.file&&e.file.name+e.file.size))})))+JSON.stringify(Object.entries(x.photos).map(([k,v])=>[k,Object.entries(v).map(([a,f])=>[a,f&&f.name+f.size])]));}
function restore(x){products=x.products;photos=x.photos;}
function pushUndo(x){undoSt.push(x||snap());if(undoSt.length>50)undoSt.shift();redoSt=[];}
function undo(){if(!undoSt.length)return;redoSt.push(snap());restore(undoSt.pop());view='list';cur=null;render();}
function redo(){if(!redoSt.length)return;undoSt.push(snap());restore(redoSt.pop());view='list';cur=null;render();}
document.addEventListener('keydown',e=>{if(view==='list'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}});

/* ---------- Texte enrichi ---------- */
function cleanHtml(h){
  const t=document.createElement('template');t.innerHTML=h;const ok={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,BR:1,P:1,H3:1,DIV:1};
  (function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===1){walk(c);if(!ok[c.tagName])c.replaceWith(...c.childNodes);else[...c.attributes].forEach(a=>c.removeAttribute(a.name));}else if(c.nodeType!==3)c.remove();});})(t.content);
  return t.innerHTML;
}
function richIn(v){v=String(v||'');return /<(b|strong|i|em|u|ul|ol|li|br|p|div|h3)\b/i.test(v)?cleanHtml(v):esc(v).replace(/\n/g,'<br>');}
function rin(el){const h=el.textContent.trim()?cleanHtml(el.innerHTML):'';get(cur)[el.dataset.lang].desc=h;}
function rcmd(c,v){document.execCommand(c,false,v||null);}
function rte(l,lang,v){
  const b=[['bold','<b>G</b>'],['italic','<i>I</i>'],['underline','<u>S</u>'],['insertUnorderedList','• Liste'],['insertOrderedList','1. Liste']];
  return `<div class="rtw"><label style="margin-bottom:.2rem">${l}</label><div class="rtb">${b.map(([c,t])=>`<button type="button" title="${c}" onmousedown="event.preventDefault();rcmd('${c}')">${t}</button>`).join('')}<button type="button" onmousedown="event.preventDefault();rcmd('formatBlock','H3')">Titre</button><button type="button" onmousedown="event.preventDefault();rcmd('formatBlock','DIV')">¶ Normal</button><button type="button" onmousedown="event.preventDefault();rcmd('removeFormat')">⌫ Style</button></div>
  <div class="rte" contenteditable="true" data-lang="${lang}" oninput="rin(this)" onpaste="event.preventDefault();document.execCommand('insertText',false,event.clipboardData.getData('text/plain'))">${richIn(v)}</div></div>`;
}

/* ---------- Lecture de l'index ---------- */
function parseIndex(text){
  const m=text.match(/const products\s*=\s*\[/);
  if(!m)throw new Error('Tableau "const products" introuvable dans ce fichier.');
  const s=m.index+m[0].length-1;let d=0,q=null,e=-1;
  for(let i=s;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='\\')i++;else if(c===q)q=null;continue;}
    if(c==='"'||c==="'"||c==='`')q=c;
    else if(c==='[')d++;
    else if(c===']'&&--d===0){e=i;break;}
  }
  if(e<0)throw new Error('Fin du tableau products introuvable.');
  const arr=(new Function('return '+text.slice(s,e+1)))();
  if(!Array.isArray(arr)||!arr.length)throw new Error('Aucun item trouvé.');
  const p=text.match(/const PRICE\s*=\s*([\d.]+)/);
  src=text;start=s;end=e;products=arr;products.forEach(x=>{x.mlist=(x.media||[]).map(n=>({old:n}));if(x.premium){x.type=x.type||'premium';delete x.premium;}});undoSt=[];redoSt=[];defPrice=p?Number(p[1]):9.99;photos={};view='list';
  render();
}
function loadText(t){try{parseIndex(t);}catch(err){alert('Erreur : '+err.message);}}
function loadFile(f){if(f)f.text().then(loadText);}
async function loadOnline(){
  try{const r=await fetch(SITE,{cache:'no-store'});if(!r.ok)throw 0;loadText(await r.text());}
  catch(e){alert("Impossible de charger le site en ligne. Choisis le fichier index.html à la place.");}
}

/* ---------- Écriture de l'index ---------- */
function usedSlugs(except){return new Set(products.filter(p=>p!==except&&p.slug).map(p=>p.slug));}
function newMedia(p){return (p.mlist||[]).filter(e=>e.file);}
function assignMedia(p){
  const L=p.mlist||[],used=new Set(L.filter(e=>e.old).map(e=>e.old));let n=1;
  L.forEach(e=>{if(!e.file)return;
    const v=e.file.type.startsWith('video/'),ext=v?((e.file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4'):(/\.gif$/i.test(e.file.name)?'gif':'jpg');
    let nm;do{nm=`${p.slug}-extra-${pad(n++)}.${ext}`;}while(used.has(nm));used.add(nm);e.name=nm;});
  p.media=L.map(e=>e.old||e.name);
  if(!p.media.length)delete p.media;
}
function ensureSlugs(){
  products.forEach(p=>{
    const has=Object.values(photos[p.id]||{}).some(Boolean)||newMedia(p).length;
    if(has&&!p.slug){
      const base=slugify(p.fr.name)||('item-'+pad(p.id));let s=base,n=2;const u=usedSlugs(p);
      while(u.has(s))s=base+'-'+n++;p.slug=s;
    }
  });
  products.forEach(p=>{if(p.slug||!newMedia(p).length)assignMedia(p);});
}
const q=JSON.stringify;
function ser(p){
  const t=l=>`{ name: ${q(l.name||'')}, desc: ${q(l.desc||'')}, tag: ${q(l.tag||'')} }`;
  return `  {\n    id: ${p.id},\n`+(p.slug?`    slug: ${q(p.slug)},\n`:'')+(p.price!=null&&p.price!==''?`    price: ${Number(p.price)},\n`:'')+(p.cond&&COND[p.cond]?`    cond: ${q(p.cond)},\n`:'')+(p.type&&TYPES[p.type]?`    type: ${q(p.type)},\n`:'')+(p.articulated?`    articulated: true,\n`:'')+(p.cover&&p.cover!=='front'&&ANG.some(a=>a[0]===p.cover)?`    cover: ${q(p.cover)},\n`:'')+(p.stock===false||p.stock==='limited'?`    stock: ${q(p.stock)},\n`:'')+(p.media&&p.media.length?`    media: ${q(p.media)},\n`:'')+`    en: ${t(p.en)},\n    fr: ${t(p.fr)}\n  }`;
}
function productsCode(){
  ensureSlugs();products.forEach(p=>{if(!p.en.name)p.en.name=p.fr.name;});
  return 'const products = [\n'+products.map(ser).join(',\n')+'\n];';
}
function copyCode(){
  const ta=document.getElementById('codeTa'),t=ta.value,st=document.getElementById('dlSt');
  const manual=()=>{st.textContent='Code sélectionné : fais Ctrl+C (⌘+C sur Mac).';};
  const fb=()=>{ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}ok?(st.textContent='Code copié ✓'):manual();};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>{st.textContent='Code copié ✓';},fb);else fb();
}
function buildIndex(){
  ensureSlugs();
  products.forEach(p=>{if(!p.en.name)p.en.name=p.fr.name;});
  return src.slice(0,start)+'[\n'+products.map(ser).join(',\n')+'\n]'+src.slice(end+1);
}

/* ---------- Interface ---------- */
function photoCount(p){return Object.values(photos[p.id]||{}).filter(Boolean).length+newMedia(p).length;}
function render(){
  const app=document.getElementById('app');
  document.getElementById('bar').hidden=view==='load';
  if(view==='load'){
    app.innerHTML=`<div class="card drop" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="event.preventDefault();this.classList.remove('drag');loadFile(event.dataTransfer.files[0])">
      <h2 style="font-size:1.1rem">1. Charge l'index de MinescraftPops</h2>
      <p>Glisse ici le fichier <code>index.html</code> du site, ou choisis-le.</p>
      <button class="btn" onclick="document.getElementById('f').click()">📄 Choisir index.html</button>
      <input id="f" type="file" accept=".html,text/html" hidden onchange="loadFile(this.files[0])">
      <button class="btn2" onclick="loadOnline()">🌐 Charger depuis le site en ligne</button>
    </div>`;
    return;
  }
  if(view==='edit'){return renderEdit();}
  app.innerHTML=`<div class="row" style="margin-bottom:1rem"><h2 style="font-size:1.1rem">${products.length} items détectés</h2>
    <div class="undo-row"><button class="btn2" ${undoSt.length?'':'disabled'} onclick="undo()">↶ Annuler</button><button class="btn2" ${redoSt.length?'':'disabled'} onclick="redo()">↷ Rétablir</button><button class="btn2" onclick="document.getElementById('bulk').click()">📚 Ajouter plusieurs items</button><input id="bulk" type="file" accept="image/*" multiple hidden onchange="bulkAdd(this.files);this.value=''"><button class="btn" onclick="addItem()">➕ Ajouter un item</button></div></div>`+
  products.map((p,i)=>`<div class="card row">
    <div><span class="num">#${pad(p.id)}</span><b>${esc(p.fr.name)||'<i>(sans nom)</i>'}</b> <span class="muted">/ ${esc(p.en.name)}</span><br>
      <span class="muted">${esc(p.fr.tag)} · ${p.cond&&COND[p.cond]?COND[p.cond]+' · ':''}</span>${p.type&&TYPES[p.type]?'<b style="color:#ffd54f">'+TYPES[p.type]+'</b><span class="muted"> · </span>':''}${p.articulated?'<b style="color:#b39ddb">🦾 Articulé</b><span class="muted"> · </span>':''}${p.stock===false?'<b style="color:#ff7b6b">🚫 Épuisé</b><span class="muted"> · </span>':p.stock==='limited'?'<b style="color:#ffb74d">⚠️ Stock limité</b><span class="muted"> · </span>':''}<span class="price">${p.price!=null&&p.price!==''?Number(p.price).toFixed(2):defPrice.toFixed(2)} €</span>
      <span class="muted"> · ${p.slug?'photos individuelles':'photo de groupe'}${photoCount(p)?` · <b style="color:var(--acc)">${photoCount(p)} nouvelle(s)</b>`:''}</span></div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap"><button class="btn2 mv" title="Monter" ${i===0?'disabled':''} onclick="mv(${i},-1)">▲</button><button class="btn2 mv" title="Descendre" ${i===products.length-1?'disabled':''} onclick="mv(${i},1)">▼</button><button class="btn2" onclick="edit(${p.id})">✏️ Modifier</button><button class="btn-x" title="Supprimer" onclick="delItem(${p.id})">🗑</button></div></div>`).join('');
  updStatus();
}
function updStatus(){
  const n=products.reduce((a,p)=>a+photoCount(p),0);
  document.getElementById('status').textContent=n?`${n} nouvelle(s) photo(s)`:'';
}
function mv(i,d){const j=i+d;if(j<0||j>=products.length)return;pushUndo();[products[i],products[j]]=[products[j],products[i]];render();}
function setType(v){const p=get(cur);delete p.premium;if(v)p.type=v;else delete p.type;}
function setArt(c){const p=get(cur);if(c)p.articulated=true;else delete p.articulated;}
function setStock(v){const p=get(cur);if(v==='out')p.stock=false;else if(v==='low')p.stock='limited';else delete p.stock;}
function setCond(v){const p=get(cur);if(v)p.cond=v;else delete p.cond;}
function get(id){return products.find(p=>p.id===id);}
function addItem(){
  const bk=snap();
  const id=Math.max(0,...products.map(p=>p.id))+1;
  products.push({id,_new:true,en:{name:'',desc:'',tag:''},fr:{name:'',desc:'',tag:''}});
  edit(id,bk);
}
function edit(id,bk){editBackup=bk||snap();cur=id;view='edit';render();window.scrollTo(0,0);}
function cancelEdit(){if(editBackup)restore(editBackup);editBackup=null;view='list';cur=null;render();}
function delItem(id){
  const p=get(id);if(!p)return;
  if(!confirm('Supprimer « '+(p.fr.name||'cet item')+' » ?\nTu pourras annuler avec ↶. (Ses photos déjà en ligne restent dans le dossier images/.)'))return;
  pushUndo();products=products.filter(x=>x.id!==id);delete photos[id];
  if(cur===id){view='list';cur=null;editBackup=null;}render();
}
function autoGroups(imgs){
  const T=imgs.map(f=>f.lastModified||0),gaps=T.slice(1).map((t,i)=>t-T[i]),pos=gaps.filter(g=>g>0).sort((a,b)=>a-b);
  if(pos.length&&gaps.every(g=>g>=0)){
    const med=pos[Math.floor(pos.length/2)],thr=Math.max(15000,med*4),gr=[[imgs[0]]];
    imgs.slice(1).forEach((f,i)=>{if(gaps[i]>thr)gr.push([]);gr[gr.length-1].push(f);});
    if(gr.length>1&&gr.every(g=>g.length<=6))return gr.map(g=>({name:'',files:g}));
  }
  const out=[];for(let i=0;i<imgs.length;i+=4)out.push({name:'',files:imgs.slice(i,i+4)});return out;
}
function bulkAdd(list){
  const imgs=[...list].filter(f=>f.type.startsWith('image/')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!imgs.length)return;
  const H=/(^|[^a-z])(face|front|avant|droite|droit|right|gauche|left|dos|back|arriere|arrière)(?![a-z])/i;
  let groups=[];
  if(imgs.filter(f=>H.test(f.name)).length>=imgs.length/2){
    const m=new Map();
    imgs.forEach(f=>{const nm=f.name.replace(/\.[^.]+$/,'').replace(new RegExp(H.source,'ig'),'$1').replace(/[-_ .()]+/g,' ').trim()||'Item';const k=nm.toLowerCase();if(!m.has(k))m.set(k,{name:nm,files:[]});m.get(k).files.push(f);});
    groups=[...m.values()];
  }else groups=autoGroups(imgs);
  pushUndo();
  let id=Math.max(0,...products.map(p=>p.id));const newIds=[];
  groups.forEach(g=>{
    id++;newIds.push(id);const p={id,_new:true,en:{name:g.name,desc:'',tag:''},fr:{name:g.name,desc:'',tag:''},mlist:[]},ph=photos[id]={};
    const rest=[];g.files.forEach(f=>{const k=ANG.map(a=>a[0]).find(k=>HINT[k].test(f.name)&&!ph[k]);if(k)ph[k]=f;else rest.push(f);});
    rest.forEach(f=>{const k=ANG.map(a=>a[0]).find(k=>!ph[k]);if(k)ph[k]=f;else p.mlist.push({file:f});});
    products.push(p);
  });
  view='list';render();
  document.getElementById('status').textContent=groups.length+' item(s) créé(s) — identification en cours…';autoFill(groups,newIds);
}
function done(){
  const p=get(cur);
  if(p&&p._new&&!p.fr.name.trim()&&!photoCount(p))products=products.filter(x=>x!==p);

function pick(k){document.getElementById('in-'+k).click();}

function replaceMedia(i,f){if(f&&(f.type.startsWith('image/')||f.type.startsWith('video/'))){get(cur).mlist[i]={file:f};renderEdit();}}
function addMedia(list){
  const p=get(cur);p.mlist=p.mlist||[];
  [...list].filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).forEach(f=>p.mlist.push({file:f}));
  renderEdit();
}
function mvMedia(i,d){const L=get(cur).mlist,j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];renderEdit();}
function delMedia(i){get(cur).mlist.splice(i,1);renderEdit();}
function fillMany(list){
  const p=get(cur),ph=photos[cur]=photos[cur]||{};p.mlist=p.mlist||[];
  const all=[...list].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const imgs=all.filter(f=>f.type.startsWith('image/')),vids=all.filter(f=>f.type.startsWith('video/')),rest=[];
  for(const f of imgs){const k=ANG.map(a=>a[0]).find(k=>HINT[k].test(f.name)&&!ph[k]);if(k)ph[k]=f;else rest.push(f);}
  for(const f of rest){const k=ANG.map(a=>a[0]).find(k=>!ph[k]);if(k)ph[k]=f;else p.mlist.push({file:f});}

}
function applyRef(r){const p=get(cur);if(!p)return;pushUndo();applyRefTo(p,r);renderEdit();}
/* signature de couleurs : histogramme teinte/saturation de l'objet (fond uni écarté, sinon pondération centrale) */
async function descOf(src){
  const bmp=await createImageBitmap(src),k=Math.min(1,96/Math.max(bmp.width,bmp.height)),w=Math.max(8,Math.round(bmp.width*k)),h=Math.max(8,Math.round(bmp.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,t=Math.max(2,Math.round(Math.min(w,h)*.06)),bi=[];let r=0,g=0,b=0;
  for(let y=0;y<h;y++)for(let X=0;X<w;X++)if(X<t||y<t||X>=w-t||y>=h-t){const i=(y*w+X)*4;bi.push(i);r+=d[i];g+=d[i+1];b+=d[i+2];}
  r/=bi.length;g/=bi.length;b/=bi.length;let v=0;bi.forEach(i=>v+=Math.hypot(d[i]-r,d[i+1]-g,d[i+2]-b));v/=bi.length;
  const uni=v<30,H=new Float32Array(28);let tot=0;
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){
    const i=(y*w+X)*4;let wt=1;
    if(uni){if(Math.hypot(d[i]-r,d[i+1]-g,d[i+2]-b)<45)continue;}else{const dx=(X/w-.5)*2,dy=(y/h-.5)*2;wt=Math.exp(-(dx*dx+dy*dy)*1.5);}

const simil=(a,b)=>a.reduce((n,v,i)=>n+Math.min(v,b[i]),0);
let REFD=null;
async function refDescs(){

  for(const e of REF){const[hd,b64]=REFTH[e[0]].split(','),bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);REFD[e[0]]=await descOf(new Blob([u],{type:'image/jpeg'}));}

async function identify(files){
  const R=await refDescs(),ds=[];
  for(const f of files.slice(0,6)){try{ds.push(await descOf(f));}catch(e){}}

async function autoFill(groups,ids){

    st.textContent=`Identification ${i+1}/${groups.length}…`;
    const p=get(ids[i]);let sg=[];try{sg=await identify(groups[i].files);}catch(e){}
    if(!p||!sg.length)continue;p._sugg=sg;if(!groups[i].name)applyRefTo(p,sg[0][0]);if(view==='list')render();
  }

async function prep(j,mw,fmt,bgc){return /\.jpg$/.test(j.name)?toJpeg(j.file,mw,fmt,bgc):new Uint8Array(await j.file.arrayBuffer());}
const jpgOut=async c=>new Uint8Array(await (await new Promise(r=>c.toBlob(r,'image/jpeg',0.88))).arrayBuffer());

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

}
